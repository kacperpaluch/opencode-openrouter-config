<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Czat · OpenCode Models</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fff; --bg-soft: #f7f7f8; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; --hover: #f4f4f5;
    --accent: #2563eb; --accent-fill: #2563eb; --accent-soft: #eff4ff; --accent-line: #bfd3fe;
    --danger: #dc2626; --danger-soft: #fef2f2; --warn-soft: #fef3c7; --warn: #92400e; --ok: #15803d;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --bg-soft: #18181b; --fg: #ececee; --muted: #8b8b93; --line: #2a2a2e; --hover: #1d1d21;
      --accent: #6b9bff; --accent-fill: #2f64e0; --accent-soft: #172036; --accent-line: #2c4170;
      --danger: #f87171; --danger-soft: #2a1517; --warn-soft: #3a2a0c; --warn: #fbbf24; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  ::selection { background: var(--accent-line); }
  html { scrollbar-color: var(--line) transparent; }
  body {
    margin: 0; height: 100vh; display: grid; grid-template-columns: 280px minmax(0, 1fr);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color: var(--muted); }
  small { display: block; color: var(--muted); font-size: 12px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a { color: var(--accent); }
  select, textarea {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  button {
    font: inherit; color: inherit; background: var(--bg); cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; font-weight: 500; }
  button.primary:hover:not(:disabled) { background: var(--accent-fill); filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button.small { padding: 4px 10px; font-size: 12px; }

  /* --- Lewa kolumna: rozmowy --- */
  aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--bg-soft); }
  .brand { padding: 18px 18px 12px; display: grid; gap: 2px; }
  .brand b { font-size: 15px; }
  .brand a { font-size: 12px; color: var(--muted); text-decoration: none; }
  .brand a:hover { color: var(--fg); }
  .new { margin: 0 18px 12px; }
  .chats { flex: 1; overflow: auto; padding: 0 10px 18px; display: grid; gap: 2px; align-content: start; }
  .chat-item {
    display: grid; gap: 1px; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 8px 10px; background: none;
  }
  .chat-item b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item small { font-variant-numeric: tabular-nums; }
  .chat-item.active, .chat-item.active:hover:not(:disabled) { background: var(--accent-soft); }
  .chats .empty { padding: 8px 10px; color: var(--muted); }

  /* --- Prawa strona: rozmowa --- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    padding: 12px 28px; border-bottom: 1px solid var(--line);
  }
  .bar .title { flex: 1 1 200px; min-width: 0; }
  .bar small { font-variant-numeric: tabular-nums; }
  .model { display: grid; gap: 2px; justify-items: end; max-width: 100%; }
  .model select { max-width: 340px; }
  .messages { flex: 1; overflow: auto; padding: 24px 28px; }
  .thread { max-width: 820px; margin: 0 auto; display: grid; gap: 22px; }
  .intro { max-width: 520px; margin: 12vh auto 0; color: var(--muted); text-align: center; display: grid; gap: 8px; }
  .intro b { color: var(--fg); font-size: 15px; font-weight: 600; }

  .msg.user { justify-self: end; max-width: 85%; }
  .msg.user .bubble { background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; display: grid; gap: 8px; }
  .msg.user .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant { min-width: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .meta > span:not(.tag) + span::before { content: "·"; margin-right: 10px; }
  .tag { padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 500; background: var(--warn-soft); color: var(--warn); }
  .thinking { margin-bottom: 8px; color: var(--muted); }
  .thinking summary { cursor: pointer; font-size: 12px; }
  .thinking .text { white-space: pre-wrap; margin-top: 6px; padding-left: 12px; border-left: 2px solid var(--line); font-size: 12px; }
  .cursor::after { content: "▍"; color: var(--muted); animation: blink 1s steps(2) infinite; }
  @keyframes blink { to { opacity: 0; } }
  .summary-box { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-soft); display: grid; gap: 8px; }
  .summary-box .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
  .summary-box summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .summary-box .md { margin-top: 8px; font-size: 13px; }
  .note.warn .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .error-box { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); display: grid; gap: 8px; justify-items: start; }

  /* Odpowiedzi w Markdownie */
  .md { overflow-wrap: anywhere; font-size: 14px; line-height: 1.6; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 12px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 18px 0 8px; font-size: 15px; font-weight: 600; white-space: normal; }
  .md ul, .md ol { padding-left: 22px; }
  .md code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg-soft); padding: 1px 5px; border-radius: 4px; }
  .md pre { padding: 12px 14px; border-radius: 8px; background: var(--bg-soft); overflow-x: auto; }
  .md pre code { padding: 0; background: none; }
  .md table { display: block; overflow-x: auto; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .md th, .md td { padding: 6px 10px; border: 1px solid var(--line); text-align: left; }
  .md th { background: var(--bg-soft); font-weight: 600; }
  .md blockquote { padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

  /* Załączniki */
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .file {
    display: inline-flex; gap: 8px; align-items: center; max-width: 280px; padding: 5px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: inherit; text-decoration: none;
  }
  .file .kind { font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
  .file .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file.error { border-color: var(--danger); color: var(--danger); }
  .file button { border: 0; padding: 0 2px; background: none; color: var(--muted); font-size: 15px; line-height: 1; }
  .file button:hover:not(:disabled) { background: none; color: var(--fg); }
  .thumb { display: block; max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--line); }
  .file .thumb { max-width: 36px; max-height: 36px; border-radius: 4px; }

  /* Pole wiadomości */
  .composer { padding: 12px 28px 16px; border-top: 1px solid var(--line); }
  .composer-inner { max-width: 820px; margin: 0 auto; display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row textarea { flex: 1; resize: none; min-height: 38px; max-height: 240px; line-height: 1.45; }
  .note { padding: 8px 12px; border-radius: 8px; background: var(--bg-soft); color: var(--muted); }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .options { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); }
  .drop {
    position: absolute; inset: 8px; z-index: 4; display: grid; place-items: center; pointer-events: none;
    border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent-soft) 85%, transparent);
    color: var(--accent); font-size: 15px; font-weight: 500;
  }

  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 5;
    max-width: min(640px, calc(100vw - 32px)); padding: 8px 14px; border-radius: 8px; background: var(--fg); color: var(--bg);
    box-shadow: 0 6px 24px rgb(0 0 0 / .18); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s;
  }
  .toast.show { opacity: 1; visibility: visible; }
  .toast.error { background: #b91c1c; color: #fff; }

  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    aside { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .bar, .messages, .composer { padding-left: 16px; padding-right: 16px; }
    .model { justify-items: start; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <b>Czat</b>
    <a href="/">← Modele i providerzy</a>
  </div>
  <button class="primary new" data-act="new">+ Nowa rozmowa</button>
  <nav class="chats" id="chats" aria-label="Rozmowy"></nav>
</aside>

<main id="main">
  <header class="bar">
    <div class="title">
      <h1 id="title">Nowa rozmowa</h1>
      <small id="stats"></small>
    </div>
    <label class="model">
      <select id="model" aria-label="Model"><option>Ładowanie…</option></select>
      <small id="route"></small>
    </label>
    <button class="small" id="summarize" data-act="summarize" hidden
      title="Model streszcza rozmowę, a nowa rozmowa zaczyna od tego streszczenia. Ta zostaje w historii.">Streść i kontynuuj</button>
    <button class="danger small" id="delete" data-act="delete" hidden>Usuń rozmowę</button>
  </header>

  <div class="messages" id="scroller"><div class="thread" id="thread"></div></div>

  <form class="composer" id="composer">
    <div class="composer-inner">
      <div class="files" id="pending"></div>
      <div id="notes"></div>
      <div class="row">
        <button type="button" data-act="attach" title="Dołącz obrazek, PDF albo plik tekstowy (możesz też przeciągnąć lub wkleić)">+ Plik</button>
        <textarea id="input" rows="1" placeholder="Napisz wiadomość… (Enter wysyła, Shift+Enter to nowa linia)" aria-label="Wiadomość"></textarea>
        <button type="submit" class="primary" id="send">Wyślij</button>
      </div>
      <div class="options" id="pdf-options" hidden>
        <label>Rozpoznawanie PDF:
          <select id="pdf-engine">
            <option value="cloudflare-ai">cloudflare-ai — za darmo, PDF-y z tekstem</option>
            <option value="mistral-ocr">mistral-ocr — $2 za 1000 stron, skany i zdjęcia</option>
            <option value="native">natywnie — model czyta plik sam</option>
          </select>
        </label>
        <small id="pdf-hint"></small>
      </div>
      <input type="file" id="file" multiple hidden
        accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,.pdf,.csv,.tsv,.txt,.md,.json,.xml,.log">
    </div>
  </form>
  <div class="drop" id="drop" hidden>Upuść pliki, żeby je dołączyć</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { marked } from "/vendor/marked.js";
import DOMPurify from "/vendor/purify.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const usd = (v) => (v == null ? "—" : v === 0 ? "$0" : "$" + (v < 0.01 ? +v.toFixed(4) : +v.toFixed(2)));
const tok = (n) => (n == null ? "—" : n >= 1e6 ? +(n / 1e6).toFixed(2) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n));
const size = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " kB");
const when = (ms) => {
  const d = new Date(ms), today = new Date();
  return d.toDateString() === today.toDateString()
    ? d.toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString("pl-PL", { day: "numeric", month: "short" });
};
const KIND_LABEL = { image: "OBRAZ", pdf: "PDF", text: "TEKST" };
// Od tej długości kontekstu proponujemy streszczenie: każda wiadomość wysyła całą historię od nowa.
const LONG_CHAT = 40_000;
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

// Odpowiedzi modelu: Markdown bez obrazków i stylów. Obrazek z obcego adresu mógłby wynieść treść rozmowy
// (np. po wstrzyknięciu polecenia w PDF-ie), a CSP i tak blokuje zewnętrzne zasoby.
marked.setOptions({ gfm: true });
DOMPurify.addHook("afterSanitizeAttributes", (node) => {
  if (node.tagName === "A") {
    node.setAttribute("target", "_blank");
    node.setAttribute("rel", "noopener noreferrer");
  }
});
const md = (s) => DOMPurify.sanitize(marked.parse(s), {
  FORBID_TAGS: ["img", "style", "form", "input", "button", "iframe", "video", "audio"],
  FORBID_ATTR: ["style"],
});

const state = {
  config: null, // { model, models: { id: wpis z configu } }
  catalog: new Map(), // id → model z katalogu OpenRoutera (modalności, kontekst)
  chats: [],
  chat: null, // aktualna rozmowa (null = nowa)
  messages: [],
  model: null,
  pending: [], // { key, name, size, kind, status: uploading|ready|error, meta, preview, error }
  streaming: null, // { controller, draft }
  summarizing: false,
  pdfEngine: store.get("chat.pdfEngine") ?? "cloudflare-ai",
};

async function api(path, opts) {
  const res = await fetch(path, opts).catch(() => {
    throw new Error("Serwer nie odpowiada — wyłącza się po 30 min bezczynności. Uruchom OpenCode Models ponownie.");
  });
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) throw new Error(data.error);
  return data;
}

function toast(msg, error = false) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = `toast show${error ? " error" : ""}`;
  t.setAttribute("role", error ? "alert" : "status");
  clearTimeout(t.timer);
  t.timer = setTimeout(() => t.classList.remove("show"), error ? 6000 : 3000);
}

// --- Modele ---

const modelName = (id) => state.config?.models[id]?.name ?? state.catalog.get(id)?.name ?? id;
const inputs = (id) => state.catalog.get(id)?.architecture?.input_modalities ?? ["text"];

function routeText(id) {
  const entry = state.config.models[id];
  if (!entry) return "Tego modelu nie ma już w configu";
  const p = entry.options?.provider;
  const route = p?.order?.length
    ? p.order.join(" → ") + (p.allow_fallbacks === false ? " · tylko wybrani" : " → dowolny inny")
    : "OpenRouter wybiera providera";
  const c = entry.cost;
  const price = c ? ` · ${usd(c.input)} / ${usd(c.output)} za 1M` : "";
  return route + price + (inputs(id).includes("image") ? " · czyta obrazki" : " · bez obrazków");
}

function renderModels() {
  const ids = Object.keys(state.config.models);
  const sel = $("#model");
  if (!ids.length) {
    sel.innerHTML = "<option>Brak modeli w configu</option>";
    sel.disabled = true;
    $("#route").innerHTML = 'Dodaj model w <a href="/">Modelach i providerach</a>.';
    return;
  }
  sel.disabled = false;
  const known = ids.includes(state.model);
  sel.innerHTML = (known ? "" : `<option value="${esc(state.model)}">${esc(modelName(state.model))} (spoza configu)</option>`)
    + ids.map((id) => `<option value="${esc(id)}">${esc(modelName(id))}</option>`).join("");
  sel.value = state.model;
  $("#route").textContent = routeText(state.model);
}

function defaultModel() {
  const ids = Object.keys(state.config.models);
  const last = store.get("chat.model");
  const main = state.config.model?.replace(/^openrouter\//, "");
  return [last, main].find((id) => ids.includes(id)) ?? ids[0] ?? null;
}

// --- Lista rozmów ---

async function loadChats() {
  state.chats = await api("/api/chats");
  renderChats();
}

function renderChats() {
  $("#chats").innerHTML = state.chats.length
    ? state.chats.map((c) => `<button class="chat-item ${c.id === state.chat?.id ? "active" : ""}" data-chat="${esc(c.id)}">
        <b>${esc(c.title)}</b><small>${when(c.updated)}${c.cost ? ` · ${usd(c.cost)}` : ""}</small></button>`).join("")
    : '<p class="empty">Nie masz jeszcze rozmów.</p>';
}

// --- Rozmowa ---

function fileChip(f, { removable = false } = {}) {
  const href = f.meta?.id ?? f.id;
  const thumb = f.kind === "image" && (f.preview || href) ? `<img class="thumb" src="${esc(f.preview ?? `/api/files/${href}`)}" alt="">` : "";
  const status = f.status === "uploading" ? " · wysyłanie…" : f.status === "error" ? ` · ${f.error}` : "";
  const inner = `${thumb}<span class="kind">${KIND_LABEL[f.kind] ?? "PLIK"}</span>
    <span class="name" title="${esc(f.name)}">${esc(f.name)}</span><span class="muted">${size(f.size)}${esc(status)}</span>`;
  if (removable) {
    return `<span class="file ${f.status === "error" ? "error" : ""}">${inner}
      <button type="button" data-remove="${esc(f.key)}" aria-label="Usuń ${esc(f.name)}">×</button></span>`;
  }
  return `<a class="file" href="/api/files/${esc(f.id)}" target="_blank" rel="noopener">${inner}</a>`;
}

function userHtml(m) {
  const images = m.files.filter((f) => f.kind === "image");
  const others = m.files.filter((f) => f.kind !== "image");
  return `<div class="msg user"><div class="bubble">
    ${images.length ? `<div class="files">${images.map((f) => `<a href="/api/files/${esc(f.id)}" target="_blank" rel="noopener">
      <img class="thumb" src="/api/files/${esc(f.id)}" alt="${esc(f.name)}"></a>`).join("")}</div>` : ""}
    ${others.length ? `<div class="files">${others.map((f) => fileChip(f)).join("")}</div>` : ""}
    ${m.text ? `<div class="text">${esc(m.text)}</div>` : ""}
  </div></div>`;
}

function metaHtml(m) {
  const u = m.usage;
  // Cache zawsze widoczny, także 0%, żeby było jasne, czy provider go używa.
  const cached = u?.prompt_tokens_details?.cached_tokens ?? 0;
  const cache = u?.prompt_tokens ? `${Math.round((cached / u.prompt_tokens) * 100)}% z cache` : "";
  const parts = [
    esc(modelName(m.model)),
    m.provider ? esc(m.provider) : "",
    u ? `${tok(u.prompt_tokens)} wejście${cache ? ` (${cache})` : ""} · ${tok(u.completion_tokens)} wyjście` : "",
    m.cost != null ? `<b>${usd(m.cost)}</b>` : "",
  ].filter(Boolean);
  return parts.map((p) => `<span>${p}</span>`).join("");
}

function assistantHtml(m, last) {
  const streaming = m.status === "streaming";
  return `<div class="msg assistant" ${streaming ? 'id="draft"' : ""}>
    ${m.reasoning ? `<details class="thinking" ${streaming && !m.text ? "open" : ""}><summary>Myślenie${streaming && !m.text ? "…" : ""}</summary>
      <div class="text">${esc(m.reasoning)}</div></details>` : ""}
    ${m.text ? `<div class="md">${md(m.text)}</div>` : ""}
    ${streaming && !m.text && !m.reasoning ? `<div class="muted cursor">${m.provider ? `${esc(m.provider)} myśli` : "Czekam na odpowiedź"}</div>` : ""}
    ${streaming && m.text ? '<span class="cursor"></span>' : ""}
    ${m.status === "error" ? `<div class="error-box">${esc(m.error)}
      ${last ? '<button class="small" data-act="retry">Spróbuj ponownie</button>' : ""}</div>` : ""}
    ${streaming ? "" : `<div class="meta">${m.status === "aborted" ? '<span class="tag">przerwano</span>' : ""}${metaHtml(m)}</div>`}
  </div>`;
}

function summaryHtml(m) {
  const parent = state.chat?.parent_id;
  return `<div class="summary-box">
    <div class="head">
      <span><b>Kontynuacja rozmowy</b>${state.chat?.parent_title ? ` „${esc(state.chat.parent_title)}”` : ""}.
        Model widzi tylko to streszczenie, a nie wcześniejsze wiadomości i załączniki.</span>
      ${parent ? `<button class="small" data-chat="${esc(parent)}">Otwórz poprzednią</button>` : ""}
    </div>
    <details><summary>Pokaż streszczenie</summary><div class="md">${md(m.text)}</div></details>
    <div class="meta">${metaHtml(m)}</div>
  </div>`;
}

const messageHtml = (m, last) => (m.role === "summary" ? summaryHtml(m) : m.role === "user" ? userHtml(m) : assistantHtml(m, last));

// Ile tokenów zajmuje rozmowa: wejście i wyjście ostatniej odpowiedzi, czyli to, co pójdzie z następną wiadomością.
function contextUsed() {
  const last = [...state.messages].reverse().find((m) => m.usage && m.role !== "summary");
  return last ? last.usage.prompt_tokens + last.usage.completion_tokens : 0;
}

function renderThread() {
  const all = state.streaming ? [...state.messages, state.streaming.draft] : state.messages;
  if (!all.length) {
    const hasModels = Object.keys(state.config?.models ?? {}).length;
    $("#thread").innerHTML = `<div class="intro">
      <b>O czym rozmawiamy?</b>
      <span>${hasModels ? "Możesz dołączyć obrazki, PDF-y i pliki CSV: przyciskiem „+ Plik”, przeciągając je tutaj albo wklejając zrzut ekranu."
        : 'Najpierw dodaj model w <a href="/">Modelach i providerach</a>.'}</span>
      <small>PDF przy rozpoznawaniu trafia też do usługi, która go odczytuje (Cloudflare albo Mistral). Przy poufnych dokumentach bezpieczniej wysłać CSV albo tekst.</small>
    </div>`;
  } else {
    $("#thread").innerHTML = all.map((m, i) => messageHtml(m, i === all.length - 1)).join("");
  }
  renderHeader();
}

function renderHeader() {
  $("#title").textContent = state.chat?.title ?? "Nowa rozmowa";
  $("#delete").hidden = !state.chat;
  const summarize = $("#summarize");
  summarize.hidden = !state.messages.some((m) => m.role === "assistant" && m.status !== "error");
  summarize.disabled = Boolean(state.streaming) || state.summarizing;
  summarize.textContent = state.summarizing ? "Streszczam…" : "Streść i kontynuuj";
  const cost = state.messages.reduce((s, m) => s + (m.cost ?? 0), 0);
  const ctx = state.catalog.get(state.model)?.context_length ?? state.config?.models[state.model]?.limit?.context;
  const used = contextUsed();
  $("#stats").textContent = state.chat
    ? `Koszt rozmowy ${usd(cost)}${used ? ` · kontekst ${tok(used)}${ctx ? ` z ${tok(ctx)}` : ""}` : ""}`
    : "";
}

// Przewija na dół tylko wtedy, gdy użytkownik już tam był (nie przeszkadza w czytaniu wyżej).
function keepBottom(render) {
  const s = $("#scroller");
  const atBottom = s.scrollHeight - s.scrollTop - s.clientHeight < 80;
  render();
  if (atBottom) s.scrollTop = s.scrollHeight;
}

let frame = 0;
function renderDraft() {
  if (frame) return;
  frame = requestAnimationFrame(() => {
    frame = 0;
    const el = $("#draft");
    if (!el || !state.streaming) return;
    keepBottom(() => (el.outerHTML = assistantHtml(state.streaming.draft, true)));
  });
}

async function openChat(id) {
  if (state.streaming) return toast("Poczekaj na koniec odpowiedzi albo ją zatrzymaj.");
  if (!id) {
    state.chat = null;
    state.messages = [];
  } else {
    try {
      const { chat, messages } = await api(`/api/chats/${encodeURIComponent(id)}`);
      state.chat = chat;
      state.messages = messages;
      if (chat.model) state.model = chat.model;
    } catch (e) {
      toast(e.message, true);
      return openChat(null);
    }
  }
  if (location.hash.slice(1) !== (id ?? "")) history.replaceState(null, "", id ? `#${id}` : location.pathname);
  renderChats();
  renderModels();
  renderThread();
  renderComposer();
  $("#scroller").scrollTop = $("#scroller").scrollHeight;
  $("#input").focus();
}

// --- Załączniki ---

const guessKind = (file) => (file.type.startsWith("image/") ? "image"
  : file.type === "application/pdf" || /\.pdf$/i.test(file.name) ? "pdf" : "text");

async function addFiles(files) {
  for (const file of files) {
    const p = {
      key: crypto.randomUUID(), name: file.name || "wklejony-obraz.png", size: file.size, kind: guessKind(file),
      status: "uploading", preview: file.type.startsWith("image/") ? URL.createObjectURL(file) : null,
    };
    state.pending.push(p);
    renderComposer();
    try {
      p.meta = await api("/api/files", {
        method: "POST", body: file,
        headers: { "content-type": "application/octet-stream", "x-file-name": encodeURIComponent(p.name), "x-file-type": file.type },
      });
      p.kind = p.meta.kind;
      p.status = "ready";
    } catch (e) {
      p.status = "error";
      p.error = e.message;
    }
    renderComposer();
  }
}

function historyHas(kind) {
  return state.messages.some((m) => m.files?.some((f) => f.kind === kind));
}

function renderComposer() {
  $("#pending").innerHTML = state.pending.map((p) => fileChip(p, { removable: true })).join("");
  const ready = state.pending.filter((p) => p.status === "ready");
  const notes = [];
  const imagesNow = ready.some((p) => p.kind === "image");
  const noImages = !inputs(state.model).includes("image");
  if (noImages && imagesNow) notes.push(["warn", "Wybrany model nie czyta obrazków. Wybierz inny model albo usuń obrazek."]);
  else if (noImages && historyHas("image")) notes.push(["warn", "W tej rozmowie są obrazki, a wybrany model ich nie czyta — OpenRouter może zwrócić błąd."]);
  for (const p of state.pending.filter((x) => x.status === "error")) notes.push(["warn", `${p.name}: ${p.error}`]);
  $("#notes").innerHTML = notes.map(([cls, text]) => `<p class="note ${cls}" style="margin:0">${esc(text)}</p>`).join("")
    + longChatNote();

  // Wybór rozpoznawania PDF tylko, gdy w zapytaniu będzie PDF.
  const pdf = ready.some((p) => p.kind === "pdf") || historyHas("pdf");
  $("#pdf-options").hidden = !pdf;
  const native = inputs(state.model).includes("file");
  const engine = $("#pdf-engine");
  engine.querySelector('[value="native"]').disabled = !native;
  if (!native && state.pdfEngine === "native") state.pdfEngine = "cloudflare-ai";
  engine.value = state.pdfEngine;
  $("#pdf-hint").textContent = historyHas("pdf") && !ready.some((p) => p.kind === "pdf")
    ? "PDF-y z wcześniejszych wiadomości są już rozpoznane i nie kosztują drugi raz."
    : native ? "" : "Ten model nie czyta PDF-ów sam, więc OpenRouter najpierw zamienia je na tekst.";

  const busy = Boolean(state.streaming);
  const uploading = state.pending.some((p) => p.status === "uploading");
  const send = $("#send");
  send.textContent = busy ? "Zatrzymaj" : "Wyślij";
  send.classList.toggle("primary", !busy);
  send.disabled = !busy && (uploading || state.summarizing || !state.model || (noImages && imagesNow)
    || (!$("#input").value.trim() && !ready.length));
}

// Ostrzeżenie o długiej rozmowie z kosztem samego wejścia następnej wiadomości (bez zniżki za cache).
function longChatNote() {
  const used = contextUsed();
  const ctx = state.catalog.get(state.model)?.context_length;
  if (!state.chat || state.streaming || (used < LONG_CHAT && !(ctx && used > ctx / 2))) return "";
  const price = state.config.models[state.model]?.cost?.input;
  const next = price != null ? ` Samo wejście następnej wiadomości to ok. ${usd((used * price) / 1e6)}.` : "";
  return `<div class="note warn">Rozmowa ma już ${tok(used)} tokenów kontekstu, a każda wiadomość wysyła je od nowa.${esc(next)}
    Streszczenie przeniesie najważniejsze ustalenia do nowej, krótkiej rozmowy.
    <div class="actions"><button type="button" class="small" data-act="summarize" ${state.summarizing ? "disabled" : ""}>
      ${state.summarizing ? "Streszczam…" : "Streść i kontynuuj"}</button></div></div>`;
}

async function summarizeChat() {
  if (state.streaming || state.summarizing || !state.chat) return;
  state.summarizing = true;
  renderHeader();
  renderComposer();
  try {
    const chat = await api(`/api/chats/${encodeURIComponent(state.chat.id)}/summarize`, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ model: state.model }),
    });
    state.summarizing = false;
    await loadChats();
    await openChat(chat.id);
    toast("Nowa rozmowa zaczyna od streszczenia. Poprzednia zostaje na liście.");
  } catch (e) {
    toast(`Nie udało się streścić: ${e.message}`, true);
  }
  state.summarizing = false;
  renderHeader();
  renderComposer();
}

// --- Wysyłanie ---

async function sendMessage({ retry = false } = {}) {
  if (state.streaming || !state.model) return;
  const input = $("#input");
  const text = retry ? "" : input.value.trim();
  const ready = retry ? [] : state.pending.filter((p) => p.status === "ready");
  if (!retry && !text && !ready.length) return;

  const saved = { text: input.value, pending: state.pending };
  const controller = new AbortController();
  state.streaming = {
    controller,
    draft: { role: "assistant", text: "", reasoning: "", provider: null, model: state.model, status: "streaming", files: [] },
  };
  if (retry) state.messages = state.messages.filter((m, i) => !(i === state.messages.length - 1 && m.status === "error"));
  else {
    input.value = "";
    autosize();
    state.pending = state.pending.filter((p) => p.status === "uploading");
  }
  store.set("chat.model", state.model);
  keepBottom(renderThread);
  renderComposer();

  let started = false;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        chatId: state.chat?.id, model: state.model, text, files: ready.map((p) => p.meta.id), pdfEngine: state.pdfEngine, retry,
      }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({ error: res.statusText }))).error);
    started = true;
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) if (line) onEvent(JSON.parse(line));
    }
  } catch (e) {
    if (controller.signal.aborted || started) {
      // Serwer zapisuje przerwaną odpowiedź sam; pobieramy ją, gdy już tam jest.
      state.streaming = null;
      if (!controller.signal.aborted) toast(e.message, true);
      return reloadAfterAbort();
    }
    // Wiadomość nie trafiła na serwer, więc oddajemy ją do pola tekstowego.
    input.value = saved.text;
    autosize();
    state.pending = saved.pending;
    toast(e.message, true);
  }
  state.streaming = null;
  keepBottom(renderThread);
  renderComposer();
  loadChats().catch(() => {});
}

function onEvent(ev) {
  const draft = state.streaming?.draft;
  if (ev.type === "chat") {
    const fresh = !state.chat;
    state.chat = ev.chat;
    if (fresh) history.replaceState(null, "", `#${ev.chat.id}`);
    renderHeader();
    if (fresh) loadChats().catch(() => {});
  } else if (ev.type === "user") {
    state.messages.push(ev.message);
    keepBottom(renderThread);
  } else if (ev.type === "meta") {
    draft.provider = ev.provider;
    renderDraft();
  } else if (ev.type === "reasoning") {
    draft.reasoning += ev.text;
    renderDraft();
  } else if (ev.type === "content") {
    draft.text += ev.text;
    renderDraft();
  } else if (ev.type === "done") {
    state.messages.push(ev.message);
    state.streaming = null;
  }
}

async function reloadAfterAbort() {
  const id = state.chat?.id;
  renderComposer();
  if (!id) return openChat(null);
  for (let i = 0; i < 10; i++) {
    await new Promise((r) => setTimeout(r, 300));
    const { messages } = await api(`/api/chats/${encodeURIComponent(id)}`);
    if (messages.at(-1)?.role === "assistant") {
      state.messages = messages;
      break;
    }
  }
  keepBottom(renderThread);
  renderComposer();
  loadChats().catch(() => {});
}

// --- Zdarzenia ---

function autosize() {
  const t = $("#input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight + 2, 240) + "px";
}

$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (state.streaming) state.streaming.controller.abort();
  else sendMessage();
});

$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (!$("#send").disabled && !state.streaming) sendMessage();
  }
});

$("#input").addEventListener("input", () => {
  autosize();
  renderComposer();
});

// Wklejony zrzut ekranu trafia od razu jako załącznik.
$("#input").addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.files ?? [])];
  if (!files.length) return;
  e.preventDefault();
  addFiles(files);
});

$("#file").addEventListener("change", (e) => {
  addFiles([...e.target.files]);
  e.target.value = "";
});

let dragDepth = 0;
const main = $("#main");
main.addEventListener("dragenter", (e) => {
  if (!e.dataTransfer?.types.includes("Files")) return;
  dragDepth++;
  $("#drop").hidden = false;
});
main.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) {
    dragDepth = 0;
    $("#drop").hidden = true;
  }
});
main.addEventListener("dragover", (e) => e.preventDefault());
main.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  $("#drop").hidden = true;
  addFiles([...(e.dataTransfer?.files ?? [])]);
});

$("#model").addEventListener("change", (e) => {
  state.model = e.target.value;
  store.set("chat.model", state.model);
  $("#route").textContent = routeText(state.model);
  renderHeader();
  renderComposer();
});

$("#pdf-engine").addEventListener("change", (e) => {
  state.pdfEngine = e.target.value;
  store.set("chat.pdfEngine", state.pdfEngine);
});

document.addEventListener("click", async (e) => {
  const remove = e.target.closest("[data-remove]");
  if (remove) {
    const p = state.pending.find((x) => x.key === remove.dataset.remove);
    if (p?.preview) URL.revokeObjectURL(p.preview);
    state.pending = state.pending.filter((x) => x !== p);
    return renderComposer();
  }
  const item = e.target.closest("[data-chat]");
  if (item) return openChat(item.dataset.chat);

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const name = act.dataset.act;
  if (name === "new") return openChat(null);
  if (name === "attach") return $("#file").click();
  if (name === "retry") return sendMessage({ retry: true });
  if (name === "summarize") return summarizeChat();
  if (name === "delete") {
    // Dwa kliknięcia zamiast okna potwierdzenia.
    if (!act.dataset.confirm) {
      act.dataset.confirm = "1";
      act.textContent = "Na pewno usunąć?";
      act.timer = setTimeout(() => {
        delete act.dataset.confirm;
        act.textContent = "Usuń rozmowę";
      }, 4000);
      return;
    }
    clearTimeout(act.timer);
    delete act.dataset.confirm;
    act.textContent = "Usuń rozmowę";
    try {
      await api(`/api/chats/${encodeURIComponent(state.chat.id)}`, { method: "DELETE", headers: { "content-type": "application/json" } });
      toast(`Usunięto „${state.chat.title}”`);
      await loadChats();
      openChat(null);
    } catch (err) {
      toast(err.message, true);
    }
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.streaming) state.streaming.controller.abort();
});

addEventListener("hashchange", () => {
  const id = location.hash.slice(1) || null;
  if (id !== (state.chat?.id ?? null)) openChat(id);
});

// --- Start ---

try {
  const [config, catalog] = await Promise.all([api("/api/config"), api("/api/models")]);
  state.config = config;
  state.catalog = new Map(catalog.map((m) => [m.id, m]));
  state.model = defaultModel();
  await loadChats();
  await openChat(location.hash.slice(1) || null);
} catch (e) {
  $("#thread").innerHTML = `<div class="error-box" role="alert">${esc(e.message)}
    <button class="small" onclick="location.reload()">Spróbuj ponownie</button></div>`;
}
</script>
</body>
</html>
